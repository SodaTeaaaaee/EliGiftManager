<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>EliGiftManager</title>
    <!--
      Dark-mode-safe background color to avoid a white flash before Vue/naive-ui
      mount and apply the real theme tokens. Matches the warm paper / warm umber
      charcoal charter at a coarse level; real tokens take over once main.css
      and the theme system load. [P0-INTEGRATION]: replace with token-driven
      values once src/shared/styles/tokens.css exists.
    -->
    <style>
      html {
        background-color: #faf6f0;
      }
      @media (prefers-color-scheme: dark) {
        html {
          background-color: #1e1915;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
